<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>متابعة روحية</title>
  <style>
    body {font-family: Cairo, Cario; direction: rtl; background: #f4f4f4; padding: 20px;}
    .form-box {background: #fff; padding: 20px; border-radius: 8px; max-width: 800px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1);}
    label {display: block; margin: 10px 0 5px; font-weight: bold;}
    input[type="text"], input[type="password"], input[type="date"], select {width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px;}
    .section {margin-bottom: 20px; padding: 10px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa;}
    .section h3 {margin-top: 0; color: #333;}
    .options label {margin-right: 15px;}
    button {background: #0078d7; color: #fff; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;}
    button:hover {background: #005a9e;}
    #loading {color: #d35400; font-weight: bold; margin-top: 10px;}
    #reportBox {margin-top: 20px;}
    table {border-collapse: collapse; width: 100%; text-align: center;}
    th, td {border: 1px solid #999; padding: 8px;}
    th {background: #eee;}
  </style>
</head>
<body>
<div class="form-box">
  <h2>متابعة روحية كنيسة العذراء مريم بالنواميس و المراونة</h2>
  <h2>إعداد روماني رؤوف</h2>
  
  <label>الرقم القومي:</label>
  <input type="text" id="nid" placeholder="ادخل الرقم القومي">
  <button onclick="searchNID()">بحث</button>
  
  <div id="loading"></div>
  <div id="nameBox" style="margin-top:15px; font-weight:bold;"></div>
  
  <form id="attendanceForm" onsubmit="submitForm(event)" style="display:none; margin-top:20px;">
    
    <div class="section">
      <h3>الأنشطة</h3>
      <div class="options">
        <label>قداس:
          <select name="mass"><option>حضر</option><option>لم يحضر</option></select>
        </label>
        <label>مدارس أحد:
          <select name="sundaySchool"><option>حضر</option><option>لم يحضر</option></select>
        </label>
        <label>اجتماع خدمة:
          <select name="serviceMeeting"><option>حضر</option><option>لم يحضر</option></select>
        </label>
        <label>اجتماع:
          <select name="meeting"><option>حضر</option><option>لم يحضر</option></select>
        </label>
      </div>
    </div>
   <div class="section">
  <h3>الأجبية</h3>
  <label><input type="radio" name="agpeya" value="منتظم"> منتظم</label>
  <label><input type="radio" name="agpeya" value="غير منتظم"> غير منتظم</label>
</div>
<div class="section">
  <h3>القراءات</h3>
  <label><input type="radio" name="readings" value="عهد قديم فقط"> عهد قديم فقط</label>
  <label><input type="radio" name="readings" value="عهد جديد فقط"> عهد جديد فقط</label>
  <label><input type="radio" name="readings" value="عهد قديم وعهد جديد"> عهد قديم وعهد جديد</label>
</div>

    
    <button type="submit">تسجيل</button>
  </form>
    <hr>
 <hr>
<h3>التقرير</h3>
<!-- زر لفتح التقرير -->
<button onclick="showReportForm()">عرض التقرير</button>

<!-- الفورم مخفي لحد ما المستخدم يدخل كلمة السر -->
<div id="reportForm" style="display:none; margin-top:15px;">
  <input type="password" id="reportPass" placeholder="ادخل كلمة السر"><br>
  <input type="date" id="reportDate"><br>
  <input type="text" id="reportName" placeholder="ابحث بجزء من الاسم"><br>
  <button onclick="showReport()">عرض التقرير</button>
  <button onclick="printReport()">🖨️ طباعة التقرير</button>
</div>

<div id="reportBox"></div>


<script>
  const scriptUrl = "https://script.google.com/macros/s/AKfycbxBaaYsvUYm9CxtewDWY3Bh4iEMrRO8TaD82XH8KXhwu39i3YgByKnQwFkyGOKTe8VY0Q/exec";

  async function searchNID() {
    const nid = document.getElementById("nid").value.trim();
    if (!nid) { alert("من فضلك أدخل الرقم القومي"); return; }

    document.getElementById("loading").innerText = "جاري التحقق...";

    try {
      const response = await fetch(scriptUrl, {
        method: "POST",
        body: new URLSearchParams({ nid: nid, action: "search" })
      });
      const name = await response.text();

      document.getElementById("loading").innerText = "";

      if (name && name !== "غير موجود") {
        document.getElementById("nameBox").innerText = "الاسم: " + name;
        document.getElementById("attendanceForm").style.display = "block";
      } else {
        document.getElementById("nameBox").innerText = "الرقم غير موجود، برجاء التسجيل أولاً.";
        document.getElementById("attendanceForm").style.display = "block";
      }
    } catch (err) {
      document.getElementById("loading").innerText = "";
      document.getElementById("nameBox").innerText = "حدث خطأ أثناء التحقق.";
    }
  }

  function submitForm(e) {
  e.preventDefault();
  const form = document.getElementById("attendanceForm");
  const formData = new FormData(form);

  // ناخد القيمة المختارة من الأجبية
  const agpeyaChecked = form.querySelector("input[name='agpeya']:checked");
  const agpeya = agpeyaChecked ? agpeyaChecked.value : "";

  // ناخد القيمة المختارة من القراءات
  const readingsChecked = form.querySelector("input[name='readings']:checked");
  const readings = readingsChecked ? readingsChecked.value : "";

  formData.append("nid", document.getElementById("nid").value);
  formData.append("name", document.getElementById("nameBox").innerText.replace("الاسم: ",""));
  formData.append("agpeya", agpeya);
  formData.append("readings", readings);
  formData.append("action", "save");

  fetch(scriptUrl, { method: "POST", body: formData })
    .then(res => res.text())
    .then(txt => alert(txt))
    .catch(err => alert("خطأ: " + err));
}

  async function showReport() {
    const pass = document.getElementById("reportPass").value.trim();
    const date = document.getElementById("reportDate").value.trim();
    const name = document.getElementById("reportName").value.trim();

    const params = new URLSearchParams({ action: "report", password: pass });
    if (date) params.append("filterDate", date);
    if (name) params.append("filterName", name);

    const response = await fetch(scriptUrl, {
      method: "POST",
      body: params
    });
    const report = await response.text();
    document.getElementById("reportBox").innerHTML = report;
  }
  function showReportForm() {
  // إظهار الفورم لما المستخدم يضغط زر "عرض التقرير"
  document.getElementById("reportForm").style.display = "block";
}

async function showReport() {
  const pass = document.getElementById("reportPass").value.trim();
  const date = document.getElementById("reportDate").value.trim();
  const name = document.getElementById("reportName").value.trim();

  const params = new URLSearchParams({ action: "report", password: pass });
  if (date) params.append("filterDate", date);
  if (name) params.append("filterName", name);

  const response = await fetch(scriptUrl, {
    method: "POST",
    body: params
  });
  const report = await response.text();
  document.getElementById("reportBox").innerHTML = report;
}

function printReport() {
  // فتح نافذة الطباعة للتقرير
  const reportContent = document.getElementById("reportBox").innerHTML;
  const printWindow = window.open('', '', 'height=600,width=800');
  printWindow.document.write('<html><head><title>تقرير الحضور</title></head><body>');
  printWindow.document.write(reportContent);
  printWindow.document.write('</body></html>');
  printWindow.document.close();
  printWindow.print();
}

</script>

</body>
</html>
